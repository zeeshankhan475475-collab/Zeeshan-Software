<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Office Web Apps</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; text-align: center; padding: 50px; }
        .container { display: flex; justify-content: center; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 200px; }
        .card a { display: block; margin-top: 15px; padding: 10px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; }
        .card a:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h1>My Web Office Suite</h1>
    <p>Apni pasand ki app select karein aur browser mein use karein:</p>

    <div class="container">
        <!-- WordCraft (MS Word alternative) -->
        <div class="card">
            <h3>WordCraft</h3>
            <p>Word Processing</p>
            <a href="https://getartcraft.com/apps/wordcraft" target="_blank">Open Word</a>
        </div>

        <!-- GridCraft (MS Excel alternative) -->
        <div class="card">
            <h3>GridCraft</h3>
            <p>Spreadsheets</p>
            <a href="https://getartcraft.com/apps/gridcraft" target="_blank">Open Excel</a>
        </div>

        <!-- DeckCraft (MS PowerPoint alternative) -->
        <div class="card">
            <h3>DeckCraft</h3>
            <p>Presentations</p>
            <a href="https://getartcraft.com/apps/deckcraft" target="_blank">Open Deck</a>
        </div>
    </div>

</body>
</html>
